{% extends 'core/base.html' %}

{% block title %}Login - UGCINO{% endblock %}

{% block content %}
<div class="bg-gray-50 min-h-screen py-20">
    <div class="container mx-auto px-4 max-w-md">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
            <div class="gradient-bg px-6 py-8 text-center">
                <i class="fas fa-shield-virus text-4xl text-white mb-2"></i>
                <h2 class="text-2xl font-bold text-white">Welcome Back</h2>
                <p class="text-green-100">Login to your UGCINO account</p>
            </div>
            
            <form method="post" class="p-6">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-2">Username</label>
                    <input type="text" name="username" required 
                           class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 font-semibold mb-2">Password</label>
                    <input type="password" name="password" required 
                           class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
                <button type="submit" class="w-full bg-primary text-white py-3 rounded-lg font-semibold hover:bg-secondary transition">
                    <i class="fas fa-sign-in-alt mr-2"></i> Login
                </button>
            </form>
            
            <div class="border-t px-6 py-4 bg-gray-50">
                <div class="text-center">
                    <p class="text-gray-600">
                        Don't have an account?
                    </p>
                    <div class="flex space-x-3 mt-2 justify-center">
                        <a href="{% url 'register' %}" class="text-primary font-semibold hover:underline">
                            <i class="fas fa-tractor mr-1"></i> Register as Farmer
                        </a>
                        <span class="text-gray-400">|</span>
                        <a href="{% url 'vet_register' %}" class="text-green-600 font-semibold hover:underline">
                            <i class="fas fa-user-md mr-1"></i> Register as Vet
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
