{% extends 'core/base.html' %}

{% block title %}Register Farm - UGCINO{% endblock %}

{% block content %}
<div class="bg-gray-50 min-h-screen py-12">
    <div class="container mx-auto px-4 max-w-2xl">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
            <div class="gradient-bg px-6 py-4">
                <h1 class="text-2xl font-bold text-white">Register Your Farm</h1>
                <p class="text-green-100">Add your farm to the UGCINO system</p>
            </div>
            
            <form method="post" class="p-6">
                {% csrf_token %}
                
                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-2">Farm Name *</label>
                    <input type="text" name="farm_name" required 
                           placeholder="e.g., Green Acres Farm"
                           class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
                
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">GPS Latitude *</label>
                        <input type="text" name="gps_latitude" required 
                               placeholder="e.g., -26.195"
                               class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
                    </div>
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">GPS Longitude *</label>
                        <input type="text" name="gps_longitude" required 
                               placeholder="e.g., 28.034"
                               class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">Province *</label>
                        <select name="province" required class="w-full px-4 py-2 border rounded-lg">
                            <option value="">Select Province</option>
                            <option value="Gauteng">Gauteng</option>
                            <option value="Western Cape">Western Cape</option>
                            <option value="KwaZulu-Natal">KwaZulu-Natal</option>
                            <option value="Eastern Cape">Eastern Cape</option>
                            <option value="Free State">Free State</option>
                            <option value="Limpopo">Limpopo</option>
                            <option value="Mpumalanga">Mpumalanga</option>
                            <option value="North West">North West</option>
                            <option value="Northern Cape">Northern Cape</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">District *</label>
                        <input type="text" name="district" required 
                               placeholder="e.g., Johannesburg"
                               class="w-full px-4 py-2 border rounded-lg">
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">Farm Size (hectares) *</label>
                        <input type="number" step="0.01" name="farm_size" required 
                               placeholder="e.g., 150.5"
                               class="w-full px-4 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">Owner Contact *</label>
                        <input type="text" name="owner_contact" required 
                               placeholder="e.g., +27721234567"
                               class="w-full px-4 py-2 border rounded-lg">
                    </div>
                </div>
                
                <div class="flex space-x-4">
                    <button type="submit" class="flex-1 bg-primary text-white py-3 rounded-lg font-semibold hover:bg-secondary transition">
                        <i class="fas fa-save mr-2"></i> Register Farm
                    </button>
                    <a href="/farms/" class="flex-1 bg-gray-300 text-gray-700 py-3 rounded-lg font-semibold text-center hover:bg-gray-400 transition">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
